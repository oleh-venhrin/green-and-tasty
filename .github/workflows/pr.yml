name: PR

on:
  pull_request:
    branches:
      - main
    paths:
      - "frontend/restaurant-frontend-app/**"

  push:
    branches: 
      - main
    paths:
      - 'frontend/restaurant-frontend-app/**'
  workflow_dispatch:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/restaurant-frontend-app
    steps: 
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/restaurant-frontend-app/.nvmrc
          cache: npm
          cache-dependency-path: frontend/restaurant-frontend-app/package-lock.json
      
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check app
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Type-check specs
        run: npx tsc -p tsconfig.spec.json --noEmit

      - name: Production build
        run: npm run build
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
      
      - name: Configure AWS credentials
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}

      - name: Deploy to S3 and Invalidate CloudFront
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          aws s3 sync dist/restaurant-frontend-app/browser s3://${{ vars.S3_BUCKET || 'restaurant-frontend-161877659602' }}/ --delete
          aws cloudfront create-invalidation --distribution-id E3SPAZDBN1MKZ0 --paths "/*"
